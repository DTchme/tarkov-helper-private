name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish TarkovHelper (win-x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read application version
        id: app_version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath 'TarkovHelper/TarkovHelper.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Application version was not found in TarkovHelper.csproj.'
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore dependencies
        run: dotnet restore TarkovHelper/TarkovHelper.csproj --runtime win-x64

      - name: Publish self-contained application
        run: >-
          dotnet publish TarkovHelper/TarkovHelper.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output publish/win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:PublishReadyToRun=false

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'publish/win-x64/TarkovHelper.exe')) {
            throw 'Published executable was not created.'
          }

      - name: Create publish ZIP and update metadata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $zipName = 'TarkovHelper_{0}_windows_v6.zip' -f $env:APP_VERSION
          $zipPath = Join-Path 'release' $zipName
          Compress-Archive -Path 'publish/win-x64/*' -DestinationPath $zipPath -CompressionLevel Optimal -Force

          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -LiteralPath 'release/SHA256SUMS.txt' -Encoding ascii

          $downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:APP_VERSION/$zipName"
          $changelogUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v$env:APP_VERSION"
          $updateXml = @"
          <?xml version="1.0" encoding="utf-8"?>
          <item>
            <version>$env:APP_VERSION.0</version>
            <url>$downloadUrl</url>
            <changelog>$changelogUrl</changelog>
            <checksum algorithm="SHA256">$hash</checksum>
            <mandatory>false</mandatory>
          </item>
          "@
          $updateXml | Set-Content -LiteralPath 'release/update.xml' -Encoding utf8

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: TarkovHelper-${{ steps.app_version.outputs.version }}-windows-v6
          path: release/TarkovHelper_${{ steps.app_version.outputs.version }}_windows_v6.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $existingRelease = gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; keeping the published assets unchanged."
            exit 0
          }

          $zipPath = 'release/TarkovHelper_{0}_windows_v6.zip' -f $env:APP_VERSION
          gh release create $tag `
            $zipPath `
            'release/SHA256SUMS.txt' `
            'release/update.xml' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "TarkovHelper v$env:APP_VERSION" `
            --generate-notes

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish GitHub Release $tag."
          }
